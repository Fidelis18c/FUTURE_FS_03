openapi: 3.0.0
info:
  title: HSSTORE API
  version: 1.0.0
  description: API Documentation for the HSSTORE Backend
servers:
  - url: https://future-fs-03-vert.vercel.app
    description: Production server
  - url: http://localhost:5000
    description: Development server

tags:
  - name: Auth
    description: User authentication
  - name: Products
    description: Product management
  - name: Categories
    description: Category management
  - name: Cart
    description: Shopping cart operations
  - name: Orders
    description: Order processing
  - name: Shipping
    description: Shipping and tracking
  - name: Users
    description: User profile and address management
  - name: Payments
    description: Payment processing webhooks
  - name: Admin
    description: Admin-only product, variant, category, and image management

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone_number, password, full_name]
              properties:
                email: { type: string }
                phone_number: { type: string }
                password: { type: string }
                full_name: { type: string }
      responses:
        '201': { description: User registered successfully }
        '400': { description: Invalid input or user already exists }

  /api/auth/login:
    post:
      summary: Login a user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }

  /api/products:
    get:
      summary: Get all products
      tags: [Products]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
          description: Number of items to return
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
          description: Number of items to skip
        - in: query
          name: category
          schema: { type: string }
          description: Filter by category slug
        - in: query
          name: search
          schema: { type: string }
          description: Search by product name or description
      responses:
        '200': { description: A list of products }

  /api/products/{slug}:
    get:
      summary: Get product by slug
      tags: [Products]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product details }

  /api/categories:
    get:
      summary: Get all categories
      tags: [Categories]
      responses:
        '200': { description: A list of categories }

  /api/categories/{slug}:
    get:
      summary: Get category by slug
      tags: [Categories]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Category details }

  /api/cart:
    get:
      summary: Get user cart
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User cart details }
    post:
      summary: Add item to cart
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variant_id: { type: integer }
                quantity: { type: integer }
      responses:
        '201': { description: Item added to cart }

  /api/cart/{id}:
    put:
      summary: Update cart item quantity
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer }
      responses:
        '200': { description: Cart item updated }
    delete:
      summary: Remove item from cart
      tags: [Cart]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Cart item removed }

  /api/orders:
    post:
      summary: Create a new order
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, payment_phone]
              properties:
                address_id: { type: integer }
                payment_phone: { type: string }
      responses:
        '201': { description: Order created }

  /api/orders/me:
    get:
      summary: Get my orders
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of user orders }

  /api/orders/{id}:
    get:
      summary: Get order details
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Order details }

  /api/shipping/order/{orderId}:
    get:
      summary: Get shipment details by order ID
      tags: [Shipping]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Shipment details }

  /api/shipping/{id}/status:
    patch:
      summary: Update shipment status (Admin only)
      tags: [Shipping]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: 
                  type: string
                  enum: [pending, shipped, delivered]
      responses:
        '200': { description: Shipment status updated }

  /api/user/addresses:
    get:
      summary: Get my addresses
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of user addresses }
    post:
      summary: Add a new address
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone_number: { type: string }
                region: { type: string }
                city: { type: string }
                street: { type: string }
                is_default: { type: boolean }
      responses:
        '201': { description: Address added }

  /api/payments/webhook:
    post:
      summary: Handle Zenopay webhook
      tags: [Payments]
      responses:
        '200': { description: Webhook received }

  /api/contact:
    post:
      summary: Send a contact message
      tags: [Contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string }
                message: { type: string }
      responses:
        '201': { description: Message received }
        '400': { description: Missing or invalid fields }
    get:
      summary: List contact messages (admin only)
      tags: [Contact]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of contact messages }

  /api/admin/products:
    get:
      summary: List all products with variants (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Full list of products with their variants }
    post:
      summary: Create a product, optionally with variants (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category_id, price]
              properties:
                name: { type: string }
                category_id: { type: string, format: uuid }
                slug: { type: string, description: Auto-generated from name if omitted }
                description: { type: string }
                image_url: { type: string }
                price: { type: number }
                variants:
                  type: array
                  items:
                    type: object
                    required: [price]
                    properties:
                      color: { type: string }
                      storage: { type: string }
                      price: { type: number }
                      image_url: { type: string, description: Falls back to the product's image_url if omitted }
                      available: { type: integer, default: 0 }
      responses:
        '201': { description: Product created, with any variants }
        '400': { description: Missing required fields, or slug already exists }

  /api/admin/products/{id}:
    get:
      summary: Get a single product with variants (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Product details with variants }
        '404': { description: Product not found }
    put:
      summary: Update a product (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send only the fields you want to change
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                image_url: { type: string }
                price: { type: number }
                category_id: { type: string, format: uuid }
      responses:
        '200': { description: Product updated }
        '400': { description: No fields to update, or slug already exists }
        '404': { description: Product not found }
    delete:
      summary: Delete a product (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Product deleted }
        '404': { description: Product not found }
        '409': { description: Product has existing orders and cannot be deleted }

  /api/admin/products/{id}/variants:
    post:
      summary: Add a variant to an existing product (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                color: { type: string }
                storage: { type: string }
                price: { type: number }
                image_url: { type: string, description: Falls back to the product's image_url if omitted }
                available: { type: integer, default: 0 }
      responses:
        '201': { description: Variant created }
        '400': { description: Missing price }
        '404': { description: Product not found }

  /api/admin/variants/{id}:
    put:
      summary: Update a variant's price, image, attributes, or stock (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send only the fields you want to change
              properties:
                color: { type: string }
                storage: { type: string }
                price: { type: number }
                image_url: { type: string }
                available: { type: integer, description: Stock quantity }
      responses:
        '200': { description: Variant updated }
        '404': { description: Variant not found }
    delete:
      summary: Delete a variant (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Variant deleted }
        '404': { description: Variant not found }
        '409': { description: Variant has existing orders and cannot be deleted }

  /api/admin/categories:
    post:
      summary: Create a category (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string, description: Auto-generated from name if omitted }
      responses:
        '201': { description: Category created }
        '400': { description: Missing name, or slug already exists }

  /api/admin/upload:
    post:
      summary: Upload a product/variant image to Supabase Storage (Admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file, max 5MB
      responses:
        '201': { description: Upload succeeded — returns the public URL }
        '400': { description: No file provided, wrong file type, or file too large }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
